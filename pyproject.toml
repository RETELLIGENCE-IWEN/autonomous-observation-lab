[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-observation-lab"
version = "0.1.0"
description = "Research benchmarks for decision-aware autonomous observation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
learning = ["torch>=2.4"]
visualization = ["rerun-sdk>=0.36,<0.37"]
reporting = ["matplotlib>=3.8"]
all = ["matplotlib>=3.8", "pytest>=8", "rerun-sdk>=0.36,<0.37", "torch>=2.4"]

[project.scripts]
aol-evaluate = "autonomous_observation_lab.benchmark.evaluate:main"
aol-train-world-model = "autonomous_observation_lab.world_models.train:main"
aol-visualize-gimbal = "autonomous_observation_lab.gimbal_servoing.visualization:main"
aol-generate-gimbal-dataset = "autonomous_observation_lab.gimbal_servoing.dataset:main"
aol-train-gimbal-gru = "autonomous_observation_lab.gimbal_servoing.gru_training:main"
aol-compare-gimbal-gru-profiles = "autonomous_observation_lab.gimbal_servoing.gru_profiles:main"
aol-replicate-gimbal-gru-o2 = "autonomous_observation_lab.gimbal_servoing.gru_replication:main"
aol-evaluate-gimbal-gru-control = "autonomous_observation_lab.gimbal_servoing.gru_control:main"
aol-evaluate-gimbal-adaptive-position = "autonomous_observation_lab.gimbal_servoing.adaptive_position:main"
aol-evaluate-gimbal-visibility-risk-position = "autonomous_observation_lab.gimbal_servoing.adaptive_position_v21:main"
aol-analyze-gimbal-position-performance = "autonomous_observation_lab.gimbal_servoing.performance_atlas:main"
aol-evaluate-gimbal-recovery = "autonomous_observation_lab.gimbal_servoing.recovery_evaluation:main"
aol-evaluate-gimbal-recovery-protocol = "autonomous_observation_lab.gimbal_servoing.recovery_protocol:main"
aol-evaluate-gimbal-recovery-robustness = "autonomous_observation_lab.gimbal_servoing.recovery_protocol:robustness_main"
aol-evaluate-gimbal-edge-recovery = "autonomous_observation_lab.gimbal_servoing.recovery_protocol:edge_main"
aol-calibrate-gimbal-uncertainty = "autonomous_observation_lab.gimbal_servoing.uncertainty_calibration:main"
aol-calibrate-gimbal-contextual-uncertainty = "autonomous_observation_lab.gimbal_servoing.uncertainty_calibration:contextual_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
